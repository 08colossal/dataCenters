<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Observatório Orbital — Terra 3D & World Data Centers</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

<body>
    <div id="app">
        <div id="loading">
            <div class="ring"></div>
            <div class="msg mono" id="loadingMsg">INICIALIZANDO OBSERVATÓRIO...</div>
        </div>

        <div id="topbar">
            <div id="brand">
                <h1>Observatório Orbital</h1>
                <p>Mapeamento completo de Data Centers (Dataset Kaggle).</p>
            </div>
            <div id="status" class="mono">
                <div class="dot-row"><span id="dcCount">0 NODES</span><span class="dot"></span></div>
                <div id="fps">60 FPS</div>
            </div>
        </div>

        <div id="panel">
            <button class="btn active" id="btnSurface" data-layer="surface">Superfície</button>
            <button class="btn" id="btnGrid" data-layer="grid">Grade geográfica</button>
            <button class="btn active" id="btnWarehouses" data-layer="warehouses">Data Centers</button>
            <button class="btn active" id="btnLabels" data-layer="labels">Países (Zoom)</button>
            <button class="btn" id="btnSpin" data-layer="spin">Rotação automática</button>
        </div>

        <div id="overlayLayer"></div>

        <div id="clusterPanel" hidden>
            <div id="clusterHead">
                <span id="clusterTitle" class="mono">—</span>
                <button id="clusterClose" aria-label="Fechar">✕</button>
            </div>
            <div id="clusterList"></div>
        </div>

        <div id="telemetry">
            <div id="readout">
                <div class="field">
                    <div class="k">ALTITUDE</div>
                    <div class="v mono" id="readAlt">— km</div>
                </div>
                <div class="field">
                    <div class="k">LAT / LON (centro)</div>
                    <div class="v mono" id="readLatLon">—</div>
                </div>
                <div class="field">
                    <div class="k">STATUS SISTEMA</div>
                    <div class="v mono" id="readSensor">ESTÁVEL</div>
                </div>
            </div>
            <div id="hint">Arraste para girar · role para zoom · clique nos nós para inspecionar</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
